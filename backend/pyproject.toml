[project]
name = "taskbridge-backend"
version = "0.1.0"
description = "TaskBridge Telegram Mini App backend"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.10,<4",
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1,<2",
  "redis>=5,<6",
  "rq>=1.16,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
